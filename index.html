<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium Scroll Hero</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: #0b0b0f;
  color: white;
  overflow-x: hidden;
}

/* HERO SECTION */
.hero {
  height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Background gradient glow */
.bg-glow {
  position: absolute;
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, rgba(0,140,255,0.4), transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(100px);
  z-index: 0;
}

/* Headline */
h1 {
  font-size: 70px;
  letter-spacing: 18px;
  font-weight: 800;
  display: flex;
  z-index: 2;
}

h1 span {
  display: inline-block;
}

/* Subtitle */
.subtitle {
  margin-top: 20px;
  font-weight: 300;
  opacity: 0.7;
  letter-spacing: 4px;
  z-index: 2;
}

/* Stats */
.stats {
  display: flex;
  gap: 80px;
  margin-top: 50px;
  z-index: 2;
}

.stat {
  text-align: center;
}

.stat h2 {
  font-size: 28px;
  font-weight: 600;
}

.stat p {
  font-size: 14px;
  opacity: 0.6;
}

/* Car */
.car {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 420px;   /* 👈 smaller size */
  z-index: 3;
  will-change: transform;
  filter: drop-shadow(0px 40px 60px rgba(0,0,0,0.8));
}

/* Fake ground shadow */
.ground {
  position: absolute;
  bottom: -20px;
  width: 700px;
  height: 100px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.6), transparent 70%);
  z-index: 1;
}

/* Next section */
.next {
  height: 100vh;
  background: linear-gradient(to bottom, #0b0b0f, #111);
}
</style>
</head>

<body>

<section class="hero">
  <div class="bg-glow"></div>

  <h1 id="headline"></h1>
  <div class="subtitle">DRIVE THE FUTURE</div>

  <div class="stats">
    <div class="stat">
      <h2>120%</h2>
      <p>Performance Boost</p>
    </div>
    <div class="stat">
      <h2>98%</h2>
      <p>User Satisfaction</p>
    </div>
    <div class="stat">
      <h2>250+</h2>
      <p>Successful Projects</p>
    </div>
  </div>

  <div class="ground"></div>
  <img src="car-image.png" alt="Car" class="car" />
</section>

<section class="next"></section>

<script>
gsap.registerPlugin(ScrollTrigger);

// Split headline letters
const text = "WELCOME  ITZFIZZ";
const headline = document.getElementById("headline");

text.split("").forEach(letter => {
  const span = document.createElement("span");
  span.textContent = letter;
  headline.appendChild(span);
});

// Premium intro animation
const tl = gsap.timeline();

tl.from("h1 span", {
  y: 80,
  opacity: 0,
  stagger: 0.06,
  duration: 1,
  ease: "power4.out"
})
.from(".subtitle", {
  y: 20,
  opacity: 0,
  duration: 0.8,
  ease: "power2.out"
}, "-=0.6")
.from(".stat", {
  y: 30,
  opacity: 0,
  stagger: 0.2,
  duration: 0.8,
  ease: "power3.out"
}, "-=0.5");

// Cinematic scroll animation
gsap.to(".car", {
  y: -450,
  scale: 1.05,
  ease: "none",
  scrollTrigger: {
    trigger: ".hero",
    start: "top top",
    end: "+=150%",
    scrub: 1.2,
    pin: true
  }
});

// Subtle glow movement
gsap.to(".bg-glow", {
  scale: 1.3,
  scrollTrigger: {
    trigger: ".hero",
    start: "top top",
    end: "bottom top",
    scrub: true
  }
});
</script>

</body>
</html>
